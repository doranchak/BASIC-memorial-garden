<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRACLAND.COM - BASIC to JavaScript</title>
    <style>
        body {
            background: #000;
            color: #aaa;
            font-family: "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }
        #screen {
            position: relative;
            width: 640px;
            height: 400px;
            background: #000;
            border: 2px solid #555;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 400px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #textOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #aaa;
            background: #000;
        }
        #textOverlay.hidden {
            display: none;
        }
        #hint {
            font-size: 14px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div id="screen">
        <canvas id="canvas" width="320" height="200"></canvas>
        <div id="textOverlay">Computing elevations...</div>
    </div>
    <div id="hint">Generating landscape...</div>
    <script src="FRACLAND.js"></script>
</body>
</html>
